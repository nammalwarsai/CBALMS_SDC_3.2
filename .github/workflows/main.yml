name: Daily Update

on:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update file
        run: |
          echo "Updated on $(date)" >> log.txt

      - name: Commit and Push
        run: |
          git config --global user.name "nammalwarsai"
          git config --global user.email "2300033899@kluniversity.in"
          git add .
          git diff --cached --quiet || git commit -m "auto update"
          git push
